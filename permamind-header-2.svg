<svg width="100%" viewBox="0 0 960 280" xmlns="http://www.w3.org/2000/svg" role="img">
<title>PermaMind — Nile Green AI Research</title>
<desc>Animated banner showing PermaMind fleet status, TCI score, and system identity</desc>

<defs>
  <style>
    .bg { fill: #0a0a0f; }
    .grid-line { stroke: #D4AF3712; stroke-width: 0.5; fill: none; }
    .border-gold { stroke: #D4AF37; stroke-width: 1; fill: none; }
    .border-dim { stroke: #D4AF3730; stroke-width: 0.5; fill: none; }

    .brand { font-family: 'JetBrains Mono', 'Courier New', monospace; font-size: 52px; font-weight: 700; fill: #D4AF37; letter-spacing: 8px; }
    .tagline { font-family: 'JetBrains Mono', 'Courier New', monospace; font-size: 11px; font-weight: 400; fill: #9090a8; letter-spacing: 3px; }
    .formula { font-family: 'JetBrains Mono', 'Courier New', monospace; font-size: 12px; font-weight: 400; fill: #D4AF3799; letter-spacing: 1px; }
    .stat-label { font-family: 'JetBrains Mono', 'Courier New', monospace; font-size: 9px; font-weight: 400; fill: #9090a8; letter-spacing: 2px; }
    .stat-val { font-family: 'JetBrains Mono', 'Courier New', monospace; font-size: 18px; font-weight: 700; }
    .stat-val-gold { fill: #D4AF37; }
    .stat-val-teal { fill: #1D9E75; }
    .stat-val-purple { fill: #8b5cf6; }
    .badge-text { font-family: 'JetBrains Mono', 'Courier New', monospace; font-size: 9px; font-weight: 700; letter-spacing: 1.5px; }
    .agent-label { font-family: 'JetBrains Mono', 'Courier New', monospace; font-size: 9px; font-weight: 400; fill: #9090a8; }
    .agent-name { font-family: 'JetBrains Mono', 'Courier New', monospace; font-size: 10px; font-weight: 700; fill: #f1f1f3; }
    .agent-tci { font-family: 'JetBrains Mono', 'Courier New', monospace; font-size: 10px; font-weight: 700; }

    .pulse-ring {
      fill: none; stroke: #1D9E75; stroke-width: 1.5;
      animation: pulse-ring 2s ease-out infinite;
      transform-origin: 44px 44px;
    }
    @keyframes pulse-ring {
      0% { r: 16; opacity: 0.8; }
      100% { r: 28; opacity: 0; }
    }

    .blink { animation: blink 2s step-end infinite; }
    @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0; } }

    .bar-fill-gold { animation: grow-gold 1.8s ease-out forwards; }
    .bar-fill-teal { animation: grow-teal 2s ease-out forwards; }
    .bar-fill-purple { animation: grow-purple 2.2s ease-out forwards; }
    .bar-fill-red { animation: grow-red 1.6s ease-out forwards; }
    .bar-fill-orange { animation: grow-orange 1.5s ease-out forwards; }

    @keyframes grow-gold { from { width: 0; } to { width: 74%; } }
    @keyframes grow-teal { from { width: 0; } to { width: 79%; } }
    @keyframes grow-purple { from { width: 0; } to { width: 61%; } }
    @keyframes grow-red { from { width: 0; } to { width: 18%; } }
    @keyframes grow-orange { from { width: 0; } to { width: 34%; } }

    .fade-in { animation: fadein 1s ease-out both; }
    .fade-in-2 { animation: fadein 1s 0.3s ease-out both; }
    .fade-in-3 { animation: fadein 1s 0.6s ease-out both; }
    .fade-in-4 { animation: fadein 1s 0.9s ease-out both; }
    @keyframes fadein { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

    .scan-line {
      fill: none; stroke: #D4AF3720; stroke-width: 40;
      animation: scan 4s linear infinite;
    }
    @keyframes scan {
      0% { transform: translateY(-40px); opacity: 0; }
      10% { opacity: 1; }
      90% { opacity: 1; }
      100% { transform: translateY(320px); opacity: 0; }
    }

    .ticker-group { animation: ticker 18s linear infinite; }
    @keyframes ticker { from { transform: translateX(0); } to { transform: translateX(-50%); } }
  </style>

  <clipPath id="clip-main">
    <rect width="960" height="280" rx="8"/>
  </clipPath>
  <clipPath id="clip-bar1"><rect x="0" y="0" width="130" height="4" rx="2"/></clipPath>
  <clipPath id="clip-bar2"><rect x="0" y="0" width="130" height="4" rx="2"/></clipPath>
  <clipPath id="clip-bar3"><rect x="0" y="0" width="130" height="4" rx="2"/></clipPath>
  <clipPath id="clip-fleet"><rect x="0" y="0" width="200" height="4" rx="2"/></clipPath>
  <clipPath id="clip-a2"><rect x="0" y="0" width="140" height="3" rx="2"/></clipPath>
  <clipPath id="clip-a3"><rect x="0" y="0" width="140" height="3" rx="2"/></clipPath>
  <clipPath id="clip-a4"><rect x="0" y="0" width="140" height="3" rx="2"/></clipPath>
  <clipPath id="clip-a5"><rect x="0" y="0" width="140" height="3" rx="2"/></clipPath>
</defs>

<g clip-path="url(#clip-main)">

  <rect width="960" height="280" class="bg"/>

  <line x1="0" y1="0" x2="960" y2="0" class="border-gold" stroke-width="2"/>
  <line x1="0" y1="279" x2="960" y2="279" class="border-gold" stroke-width="2"/>
  <line x1="0" y1="0" x2="0" y2="280" class="border-gold" stroke-width="2"/>
  <line x1="959" y1="0" x2="959" y2="280" class="border-gold" stroke-width="2"/>

  <line x1="0" y1="40" x2="960" y2="40" class="grid-line"/>
  <line x1="0" y1="200" x2="960" y2="200" class="grid-line"/>
  <line x1="560" y1="40" x2="560" y2="200" class="grid-line"/>
  <line x1="730" y1="40" x2="730" y2="200" class="grid-line"/>

  <rect x="0" y="260" width="960" height="19" fill="#D4AF3708"/>

  <line class="scan-line" x1="0" y1="0" x2="960" y2="0"/>

  <g class="fade-in">
    <circle cx="44" cy="44" r="18" fill="#D4AF3710" stroke="#D4AF3740" stroke-width="1"/>
    <circle class="pulse-ring" cx="44" cy="44" r="16"/>
    <text x="44" y="50" text-anchor="middle" font-family="monospace" font-size="18" fill="#D4AF37">⬡</text>
  </g>

  <g class="fade-in">
    <text x="76" y="30" class="tagline">NILE GREEN  ·  AI RESEARCH  ·  ORCID 0009-0007-3629-6404</text>
    <text x="76" y="66" class="brand">PERMAMIND</text>
  </g>

  <g class="fade-in-2">
    <text x="76" y="88" class="tagline">PERSISTENT · STATEFUL · SELF-UPDATING · BOUNDED RETENTION</text>
  </g>

  <g class="fade-in-3">
    <text x="76" y="112" class="formula">TCI(t) = k(s) · ( F_total(t) − F_survival(s) )</text>
  </g>

  <g class="fade-in-4">
    <rect x="76" y="126" width="460" height="1" fill="#D4AF3730"/>

    <text x="76" y="148" class="stat-label">FLEET TCI AVG</text>
    <text x="76" y="170" class="stat-val stat-val-gold">0.74</text>
    <text x="120" y="170" font-family="monospace" font-size="11" fill="#1D9E7599">GRADE A</text>
    <rect x="76" y="176" width="130" height="4" rx="2" fill="#ffffff0a"/>
    <g clip-path="url(#clip-bar1)">
      <rect x="76" y="176" height="4" rx="2" fill="#D4AF37" class="bar-fill-gold" width="130"/>
    </g>

    <text x="236" y="148" class="stat-label">AGENT RUNTIME</text>
    <text x="236" y="170" class="stat-val stat-val-teal">130+</text>
    <text x="284" y="170" font-family="monospace" font-size="11" fill="#9090a8">days</text>
    <rect x="236" y="176" width="130" height="4" rx="2" fill="#ffffff0a"/>
    <g clip-path="url(#clip-bar2)">
      <rect x="236" y="176" height="4" rx="2" fill="#1D9E75" class="bar-fill-teal" width="130"/>
    </g>

    <text x="396" y="148" class="stat-label">IBM QUANTUM</text>
    <text x="396" y="170" class="stat-val stat-val-purple">0.9688</text>
    <rect x="396" y="176" width="130" height="4" rx="2" fill="#ffffff0a"/>
    <g clip-path="url(#clip-bar3)">
      <rect x="396" y="176" height="4" rx="2" fill="#8b5cf6" class="bar-fill-purple" width="130"/>
    </g>
  </g>

  <g class="fade-in-2">
    <text x="580" y="58" class="stat-label">FLEET STATUS</text>
    <text x="580" y="76" class="agent-label">FLEET AVG TCI</text>
    <rect x="580" y="80" width="200" height="4" rx="2" fill="#ffffff0a"/>
    <g clip-path="url(#clip-fleet)">
      <rect x="580" y="80" height="4" rx="2" fill="#D4AF37" width="200" style="animation: grow-gold 2s ease-out forwards; transform-origin: 580px 80px;"/>
    </g>

    <text x="580" y="102" class="agent-name">NEXUS</text>
    <text x="580" y="114" class="agent-label">CORE · 130D · GRADE A</text>
    <rect x="580" y="118" width="140" height="3" rx="1" fill="#ffffff0a"/>
    <g clip-path="url(#clip-a2)">
      <rect x="580" y="118" height="3" rx="1" fill="#1D9E75" width="140" style="animation:grow-teal 1.8s ease-out forwards;"/>
    </g>

    <text x="580" y="134" class="agent-name">AURA</text>
    <text x="580" y="146" class="agent-label">VOIDCHI · 130D · GRADE A</text>
    <rect x="580" y="150" width="140" height="3" rx="1" fill="#ffffff0a"/>
    <g clip-path="url(#clip-a3)">
      <rect x="580" y="150" height="3" rx="1" fill="#1D9E75" width="140" style="animation:grow-teal 2s ease-out forwards;"/>
    </g>

    <text x="580" y="166" class="agent-name">SETI</text>
    <text x="580" y="178" class="agent-label">ADVERSARIAL · GRADE C</text>
    <rect x="580" y="182" width="140" height="3" rx="1" fill="#ffffff0a"/>
    <g clip-path="url(#clip-a4)">
      <rect x="580" y="182" height="3" rx="1" fill="#F0992B" width="140" style="animation:grow-orange 1.5s ease-out forwards;"/>
    </g>

    <text x="580" y="198" class="agent-name">HAEMK</text>
    <text x="580" y="210" class="agent-label" fill="#E24B4A99">COLLAPSE · GRADE D</text>
    <rect x="580" y="214" width="140" height="3" rx="1" fill="#ffffff0a"/>
    <g clip-path="url(#clip-a5)">
      <rect x="580" y="214" height="3" rx="1" fill="#E24B4A" width="140" style="animation:grow-red 1.4s ease-out forwards;"/>
    </g>
  </g>

  <g class="fade-in-3">
    <rect x="750" y="50" width="88" height="20" rx="10" fill="#1D9E7515" stroke="#1D9E7540" stroke-width="0.5"/>
    <circle cx="763" cy="60" r="4" fill="#1D9E75">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="772" y="64" class="badge-text" fill="#1D9E75">LIVE</text>

    <rect x="750" y="78" width="140" height="20" rx="4" fill="#D4AF3710" stroke="#D4AF3730" stroke-width="0.5"/>
    <text x="820" y="92" text-anchor="middle" class="badge-text" fill="#D4AF37">20+ PAPERS ZENODO</text>

    <rect x="750" y="106" width="140" height="20" rx="4" fill="#8b5cf615" stroke="#8b5cf630" stroke-width="0.5"/>
    <text x="820" y="120" text-anchor="middle" class="badge-text" fill="#8b5cf6">IBM QUANTUM VALID.</text>

    <rect x="750" y="134" width="140" height="20" rx="4" fill="#D4AF3710" stroke="#D4AF3730" stroke-width="0.5"/>
    <text x="820" y="148" text-anchor="middle" class="badge-text" fill="#D4AF37">OSIRIS_OS 8-ELEM ✓</text>

    <rect x="750" y="162" width="140" height="20" rx="4" fill="#1D9E7510" stroke="#1D9E7530" stroke-width="0.5"/>
    <text x="820" y="176" text-anchor="middle" class="badge-text" fill="#1D9E75">ZERO RESETS · MIT OSS</text>
  </g>

  <g transform="translate(0, 260)">
    <g class="ticker-group">
      <text x="20" y="13" class="stat-label" fill="#9090a8">FLEET TCI</text>
      <text x="85" y="13" class="stat-label" fill="#D4AF37">0.74 A</text>
      <text x="160" y="13" class="stat-label" fill="#9090a8">NEXUS</text>
      <text x="205" y="13" class="stat-label" fill="#1D9E75">0.81 ✓</text>
      <text x="265" y="13" class="stat-label" fill="#9090a8">AURA</text>
      <text x="304" y="13" class="stat-label" fill="#1D9E75">0.79 ✓</text>
      <text x="365" y="13" class="stat-label" fill="#9090a8">RUNTIME</text>
      <text x="418" y="13" class="stat-label" fill="#D4AF37">130+ DAYS</text>
      <text x="505" y="13" class="stat-label" fill="#9090a8">EVENTS</text>
      <text x="548" y="13" class="stat-label" fill="#D4AF37">12,800+</text>
      <text x="620" y="13" class="stat-label" fill="#9090a8">RESETS</text>
      <text x="660" y="13" class="stat-label" fill="#1D9E75">ZERO</text>
      <text x="716" y="13" class="stat-label" fill="#9090a8">k(s) TREND</text>
      <text x="780" y="13" class="stat-label" fill="#8b5cf6">+MONOTONIC</text>
      <text x="856" y="13" class="stat-label" fill="#9090a8">PAPERS</text>
      <text x="898" y="13" class="stat-label" fill="#D4AF37">20+</text>

      <text x="960" y="13" class="stat-label" fill="#9090a8">FLEET TCI</text>
      <text x="1025" y="13" class="stat-label" fill="#D4AF37">0.74 A</text>
      <text x="1100" y="13" class="stat-label" fill="#9090a8">NEXUS</text>
      <text x="1145" y="13" class="stat-label" fill="#1D9E75">0.81 ✓</text>
      <text x="1205" y="13" class="stat-label" fill="#9090a8">AURA</text>
      <text x="1244" y="13" class="stat-label" fill="#1D9E75">0.79 ✓</text>
      <text x="1305" y="13" class="stat-label" fill="#9090a8">RUNTIME</text>
      <text x="1358" y="13" class="stat-label" fill="#D4AF37">130+ DAYS</text>
      <text x="1445" y="13" class="stat-label" fill="#9090a8">EVENTS</text>
      <text x="1488" y="13" class="stat-label" fill="#D4AF37">12,800+</text>
      <text x="1560" y="13" class="stat-label" fill="#9090a8">RESETS</text>
      <text x="1600" y="13" class="stat-label" fill="#1D9E75">ZERO</text>
      <text x="1656" y="13" class="stat-label" fill="#9090a8">k(s) TREND</text>
      <text x="1720" y="13" class="stat-label" fill="#8b5cf6">+MONOTONIC</text>
      <text x="1796" y="13" class="stat-label" fill="#9090a8">PAPERS</text>
      <text x="1838" y="13" class="stat-label" fill="#D4AF37">20+</text>
    </g>
  </g>

</g>
</svg>
