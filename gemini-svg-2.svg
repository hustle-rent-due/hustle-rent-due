<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%">
  <defs>
    <style>
      .bg-main { fill: #070708; stroke: #262626; stroke-width: 2; }
      .terminal-text { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; fill: #f4f4f5; font-size: 12px; }
      .header-title { font-weight: 700; fill: #D4AF37; font-size: 16px; letter-spacing: 1px; }
      .txt-gold { fill: #D4AF37; }
      .txt-purple { fill: #a78bfa; }
      .txt-muted { fill: #52525b; }
      .txt-green { fill: #34d399; }
      .txt-red { fill: #f87171; }
      
      /* Structural grid overlays */
      .grid-lines { fill: none; stroke: #18181b; stroke-width: 1; }
      .blueprint-line { stroke: #27272a; stroke-width: 1.5; stroke-dasharray: 4 4; }
      .node-wire { stroke: #3f3f46; stroke-width: 1.5; fill: none; }
      .node-wire-active { stroke: #D4AF37; stroke-width: 2; fill: none; stroke-dasharray: 6 3; animation: signalFlow 3s linear infinite; }
      .node-wire-alert { stroke: #f87171; stroke-width: 1.5; fill: none; stroke-dasharray: 4 4; }
      
      /* Pure CSS micro-animations */
      .pulse-fast { animation: flash 2s steps(2, start) infinite; }
      .pulse-slow { animation: breath 4s ease-in-out infinite; }
      .glow-red { animation: emergency 1.5s ease-in-out infinite; }
      .glow-green { animation: normal-glow 3s ease-in-out infinite; }
      
      @keyframes flash { 0%, 100% { opacity: 0.4; } 50% { opacity: 1; } }
      @keyframes breath { 0%, 100% { opacity: 0.6; } 50% { opacity: 1; } }
      @keyframes emergency { 0%, 100% { fill: #991b1b; filter: drop-shadow(0 0 2px #ef4444); } 50% { fill: #f87171; filter: drop-shadow(0 0 8px #ef4444); } }
      @keyframes normal-glow { 0%, 100% { filter: drop-shadow(0 0 1px #10b981); } 50% { filter: drop-shadow(0 0 5px #34d399); } }
      @keyframes signalFlow { to { stroke-dashoffset: -20; } }
    </style>
    
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" class="grid-lines"/>
    </pattern>
    
    <linearGradient id="panelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111113" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>
  </defs>

  <rect width="958" height="538" x="1" y="1" rx="8" class="bg-main" />
  <rect width="958" height="538" x="1" y="1" rx="8" fill="url(#grid)" />

  <path d="M1,38 L959,38" stroke="#27272a" stroke-width="1" />
