<circle class="c-dot" cx="4"   cy="4"   r="3" fill="#D4AF37"/>
<circle class="c-dot" cx="896" cy="4"   r="3" fill="#D4AF37"/>
<circle class="c-dot" cx="4"   cy="416" r="3" fill="#D4AF37"/>
<circle class="c-dot" cx="896" cy="416" r="3" fill="#D4AF37"/>

