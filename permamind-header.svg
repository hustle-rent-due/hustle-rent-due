<!-- Top-left micro-tag -->
<text class="mono" x="18" y="22" font-size="9" fill="#D4AF37" opacity=".65" letter-spacing=".15em">BAP×AI</text>
<!-- Top-right micro-tag -->
<text class="mono" x="896" y="22" font-size="9" fill="#8b5cf6" opacity=".75"
      letter-spacing=".05em" text-anchor="end">IBM QUANTUM · 0.9688 VALIDATED</text>

<!-- Main title -->
<text class="mono title-text" x="450" y="90" text-anchor="middle"
