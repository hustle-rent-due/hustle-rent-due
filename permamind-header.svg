<!-- Formula -->
<text class="mono" x="32" y="183" font-size="12.5" fill="#D4AF37" font-weight="bold"
      letter-spacing=".03em">TCI(t) = k(s) · (F_total − F_survival)</text>

<text class="mono" x="44" y="202" font-size="9.5" fill="#d1d5db" opacity=".65">F_total     →  cross-entropy loss or TD error</text>
<text class="mono" x="44" y="216" font-size="9.5" fill="#d1d5db" opacity=".65">F_survival  →  minimal identity task baseline</text>
<text class="mono" x="44" y="230" font-size="9.5" fill="#d1d5db" opacity=".65">k(s)        →  runtime-evolving sensitivity constant</text>

<line x1="32" y1="238" x2="428" y2="238" stroke="#D4AF37" stroke-width=".4" stroke-opacity=".2"/>

