<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&amp;display=swap');
      
      .bg { fill: #0a0a0a; stroke: #262626; stroke-width: 2; }
      .text-base { font-family: 'JetBrains Mono', monospace; fill: #e5e5e5; font-size: 14px; }
      .text-bold { font-weight: 700; }
      .accent-gold { fill: #D4AF37; }
      .accent-purple { fill: #8b5cf6; }
      .accent-muted { fill: #737373; font-size: 13px; }
      
      /* Glowing animations */
      .pulse-gold {
        animation: goldGlow 4s ease-in-out infinite;
      }
      .pulse-purple {
        animation: purpleGlow 4s ease-in-out infinite;
        animation-delay: 2s;
      }
      .scanline {
        animation: scan 8s linear infinite;
        opacity: 0.05;
      }
      
      @keyframes goldGlow {
        0%, 100% { filter: drop-shadow(0px 0px 2px rgba(212,175,55,0.4)); opacity: 0.9; }
        50% { filter: drop-shadow(0px 0px 8px rgba(212,175,55,0.8)); opacity: 1; }
      }
      @keyframes purpleGlow {
        0%, 100% { filter: drop-shadow(0px 0px 2px rgba(139,92,246,0.4)); opacity: 0.8; }
        50% { filter: drop-shadow(0px 0px 8px rgba(139,92,246,0.8)); opacity: 1; }
      }
      @keyframes scan {
        0% { transform: translateY(0px); }
        100% { transform: translateY(340px); }
      }
    </style>
    
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141414" />
      <stop offset="100%" stop-color="#0a0a0a" />
    </linearGradient>
  </defs>

  <!-- Main Frame -->
  <rect width="958" height="338" x="1" y="1" rx="8" class="bg" />
  <rect width="960" height="2" fill="#262626" class="scanline" />

  <!-- Terminal Header -->
  <path d="M1,25 L959,25" stroke="#262626" stroke-width="1" />
  <circle cx="20" cy="13" r="4" fill="#ef4444" />
  <circle cx="34" cy="13" r="4" fill="#f59e0b" />
  <circle cx="48" cy="13" r="4" fill="#10b981" />
  <text x="70" y="17" class="text-base accent-muted">core_identity_matrix.sh</text>
  <text x="830" y="17" class="text-base accent-muted" text-anchor="end">SYS_STATUS: ACTIVE</text>
  <circle cx="845" cy="13" r="3" fill="#00D26A" />

  <!-- Left Column: Manifesto Box -->
  <g transform="translate(25, 50)">
    <rect width="420" height="260" rx="6" fill="url(#boxGrad)" stroke="#262626" />
    
    <text x="20" y="35" class="text-base text-bold accent-gold">> IDENTITY MANIFESTO</text>
    
    <text x="20" y="75" class="text-base text-bold">Independent AI Researcher.</text>
    <text x="20" y="95" class="text-base accent-muted">No institutions. No funding. No permissions.</text>
    
    <text x="20" y="135" class="text-base">Building architecture that outlasts resets.</text>
    <text x="20" y="155" class="text-base">Replacing transformer loops with raw</text>
    <text x="20" y="175" class="text-base">thermodynamic continuity.</text>
    
    <text x="20" y="215" class="text-base text-bold pulse-gold">"Not philosophy. Physics."</text>
    <text x="20" y="235" class="text-base text-bold pulse-purple">"Not hype. Mathematics."</text>
  </g>

  <!-- Right Column: System Architecture Stats Grid -->
  <g transform="translate(470, 50)">
    <rect width="465" height="260" rx="6" fill="url(#boxGrad)" stroke="#262626" />
    
    <!-- Row 1: Stateful Engine -->
    <g transform="translate(20, 30)">
      <rect width="425" height="45" rx="4" fill="#0d0d0d" stroke="#1f1f1f" />
      <text x="15" y="27" class="text-base text-bold accent-purple">PSSU CORE</text>
      <text x="110" y="27" class="text-base">Persistent • Stateful • Self-Updating</text>
    </g>

    <!-- Row 2: Tokenless metrics -->
    <g transform="translate(20, 85)">
      <rect width="425" height="45" rx="4" fill="#0d0d0d" stroke="#1f1f1f" />
      <text x="15" y="27" class="text-base text-bold accent-gold">OVERHEAD</text>
      <text x="110" y="27" class="text-base">0 Tokens • 0 Transformers • 0 GPU Coolers</text>
    </g>

    <!-- Row 3: Telemetry benchmark -->
    <g transform="translate(20, 140)">
      <rect width="425" height="45" rx="4" fill="#0d0d0d" stroke="#1f1f1f" />
      <text x="15" y="27" class="text-base text-bold fill-red" style="fill: #ef4444;">RUNTIME</text>
      <text x="110" y="27" class="text-base text-bold">130+ Days Nonstop Continuity</text>
    </g>

    <!-- Row 4: Math confirmation -->
    <g transform="translate(20, 195)">
      <rect width="425" height="45" rx="4" fill="#0d0d0d" stroke="#262626" />
      <text x="15" y="27" class="text-base text-bold accent-muted">METRIC</text>
      <text x="110" y="27" class="text-base accent-gold">TCI(t) = k(s) · (F_total(t) − F_survival(s))</text>
    </g>
  </g>
</svg>
